# Railway deployment configuration for Rocket.Chat
# Documentation: https://docs.railway.app/reference/config-as-code

[build]
# Use the Dockerfile in the root directory
dockerfilePath = "Dockerfile"

[deploy]
# Health check configuration
healthcheckPath = "/livez"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Start command (handled by Dockerfile CMD)
# startCommand = "node main.js"

[service]
# Internal port the application listens on
internalPort = 3000
